
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagem Hospitalar</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --cereja: #b51236;
      --cereja-escuro: #850d28;
      --cereja-claro: #fff0f3;
      --branco: #ffffff;
      --fundo: #fff7f8;
      --borda: #f0cbd4;
      --texto: #38252b;
      --cinza: #76656a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 35px auto;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .topo h1 {
      margin: 0;
      color: var(--cereja);
      font-size: 27px;
    }

    .painel,
    .pacientes-fila {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(133, 13, 40, 0.06);
    }

    .pacientes-fila h3 {
      margin: 0 0 18px;
      color: var(--cereja);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pacientes-fila h3 span {
      color: var(--cinza);
      font-size: 13px;
      font-weight: normal;
    }

    .fila-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffafb;
      border: 1px solid var(--borda);
      border-left: 4px solid var(--cereja);
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .fila-item strong {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .fila-item small {
      display: inline-block;
      margin-top: 5px;
      color: var(--cinza);
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo label {
      font-weight: bold;
      font-size: 14px;
      color: var(--cereja-escuro);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #dfc2ca;
      border-radius: 7px;
      background: white;
      color: var(--texto);
      font: inherit;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cereja);
      box-shadow: 0 0 0 3px rgba(181, 18, 54, 0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .campo-largo {
      grid-column: 1 / -1;
    }

    button {
      font: inherit;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .btn-principal,
    .btn-tv {
      background: var(--cereja);
      color: white;
    }

    .btn-principal:hover,
    .btn-tv:hover {
      background: var(--cereja-escuro);
    }

    .btn-secundario {
      background: var(--cereja-claro);
      color: var(--cereja-escuro);
      border: 1px solid var(--borda);
    }

    .btn-secundario:hover {
      background: #ffdee6;
    }

    .btn-abrir-tv {
      background: white;
      color: var(--cereja);
      border: 1px solid var(--cereja);
    }

    .btn-abrir-tv:hover {
      background: var(--cereja-claro);
    }

    .acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    #resultado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      overflow-wrap: anywhere;
    }

    #resultado.sucesso {
      display: block;
      color: #185b36;
      background: #eaf8ef;
      border: 1px solid #b8e3c6;
    }

    #resultado.erro {
      display: block;
      color: var(--cereja-escuro);
      background: var(--cereja-claro);
      border: 1px solid var(--borda);
    }

    .vazio {
      color: var(--cinza);
      text-align: center;
      padding: 12px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 1000px);
        margin: 20px auto;
      }

      .painel,
      .pacientes-fila {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .campo-largo {
        grid-column: auto;
      }

      .topo h1 {
        font-size: 23px;
      }

      .fila-item {
        align-items: stretch;
      }

      .fila-item button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="topo">
      <h1>🏥 Triagem Hospitalar</h1>
      <button type="button" class="btn-abrir-tv" id="abrir-tv">
        📺 Abrir Tela da TV
      </button>
    </header>

    <section class="pacientes-fila">
      <h3>
        Pacientes aguardando atendimento
        <span>Clique em "Chamar na TV" para chamar ao guichê.</span>
      </h3>

      <div id="fila-pacientes" aria-live="polite">
        <p class="vazio">Carregando pacientes...</p>
      </div>

      <button type="button" class="btn-secundario" id="atualizar-lista">
        ↻ Atualizar lista
      </button>
    </section>

    <section class="painel">
      <h2>🩺 Registrar triagem</h2>

      <form id="form-triagem">
        <div class="form-grid">

          <div class="campo">
            <label for="nome">Nome do paciente</label>
            <input id="nome" name="nome" placeholder="Digite o nome"
              autocomplete="name" required>
          </div>

          <div class="campo">
            <label for="sintoma">Sintoma principal</label>
            <select id="sintoma" name="sintoma" required>
              <option value="">Selecione</option>
              <option value="dor_leve">Dor leve</option>
              <option value="resfriado">Resfriado</option>
              <option value="coriza">Coriza</option>
              <option value="tosse">Tosse</option>
              <option value="febre">Febre</option>
              <option value="vomito">Vômito</option>
              <option value="diarreia">Diarreia</option>
              <option value="falta_ar_moderada">Falta de ar moderada</option>
              <option value="falta_ar_grave">Falta de ar grave</option>
              <option value="infarto">Suspeita de infarto</option>
              <option value="avc">Suspeita de AVC</option>
              <option value="convulsao">Convulsão</option>
              <option value="hemorragia">Hemorragia</option>
            </select>
          </div>

          <div class="campo">
            <label for="temp">Temperatura (°C)</label>
            <input id="temp" name="temperatura" type="number"
              placeholder="Ex.: 36,5" min="25" max="45" step="0.1">
          </div>

          <div class="campo">
            <label for="alergia">Alergias</label>
            <input id="alergia" name="alergia"
              placeholder="Informe alergias ou 'Não informado'">
          </div>

          <div class="campo campo-largo">
            <label for="observacao">Observações</label>
            <textarea id="observacao" name="observacao"
              placeholder="Informações adicionais"></textarea>
          </div>

        </div>

        <div id="resultado" role="status" aria-live="polite"></div>

        <div class="acoes">
          <button type="submit" class="btn-principal" id="salvar-btn">
            Salvar Triagem
          </button>
          <button type="reset" class="btn-secundario">
            Limpar campos
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const fila = document.getElementById("fila-pacientes");
    const resultado = document.getElementById("resultado");
    const form = document.getElementById("form-triagem");
    const salvarBtn = document.getElementById("salvar-btn");

    function mostrarResultado(mensagem, tipo) {
      resultado.textContent = mensagem;
      resultado.className = tipo;
    }

    function criarElemento(tag, texto, classe) {
      const el = document.createElement(tag);
      el.textContent = texto;
      if (classe) el.className = classe;
      return el;
    }

    async function carregarPacientes() {
      fila.replaceChildren(
        criarElemento("p", "Carregando pacientes...", "vazio")
      );

      try {
        const resposta = await fetch("/pacientes");

        if (!resposta.ok) {
          throw new Error("Não foi possível buscar os pacientes.");
        }

        const pacientes = await resposta.json();

        if (!Array.isArray(pacientes)) {
          throw new Error("O servidor retornou uma lista inválida.");
        }

        const aguardando = pacientes.filter(
          p => p && p.status === "triagem"
        );

        fila.replaceChildren();

        if (aguardando.length === 0) {
          fila.appendChild(
            criarElemento("p", "Nenhum paciente aguardando.", "vazio")
          );
          return;
        }

        aguardando.forEach(p => {
          const item = document.createElement("div");
          item.className = "fila-item";

          const informacoes = document.createElement("div");
          const nome = criarElemento("strong", p.nome || "Nome não informado");
          const detalhes = criarElemento(
            "small",
            `CPF: ${p.cpf || "-"} | Tipo: ${p.tipo || "-"}`
          );

          informacoes.append(nome, document.createElement("br"), detalhes);

          const botao = criarElemento("button", "📺 Chamar na TV", "btn-tv");
          botao.type = "button";
          botao.addEventListener("click", () => chamarNaTV(p));

          item.append(informacoes, botao);
          fila.appendChild(item);
        });
      } catch (erro) {
        console.error("Erro ao carregar pacientes:", erro);
        fila.replaceChildren(
          criarElemento(
            "p",
            "Erro ao carregar pacientes. Verifique o servidor e tente novamente.",
            "vazio"
          )
        );
      }
    }

    async function chamarNaTV(paciente) {
      /*
       * Adapte esta função ao endpoint que sua tela da TV utiliza.
       * Abrir tv.html, sozinho, não envia o paciente para a TV.
       */
      const tv = window.open("tv.html", "_blank");

      if (!tv) {
        mostrarResultado(
          "O navegador bloqueou a abertura da TV. Permita pop-ups para este site.",
          "erro"
        );
        return;
      }

      /*
       * Não existe um endpoint de chamada no código enviado.
       * Por isso, não simulamos uma chamada bem-sucedida.
       */
      mostrarResultado(
        `Tela da TV aberta. Para chamar ${paciente.nome || "o paciente"}, ` +
        "configure a comunicação com o sistema da TV.",
        "erro"
      );
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const sintoma = document.getElementById("sintoma").value;
      const temperaturaTexto = document.getElementById("temp").value;
      const alergia = document.getElementById("alergia").value.trim();
      const observacao = document.getElementById("observacao").value.trim();

      if (!nome || !sintoma) {
        mostrarResultado("Preencha o nome e o sintoma principal.", "erro");
        return;
      }

      let temperatura = null;

      if (temperaturaTexto !== "") {
        temperatura = Number(temperaturaTexto);

        if (!Number.isFinite(temperatura) ||
            temperatura < 25 || temperatura > 45) {
          mostrarResultado("Informe uma temperatura válida.", "erro");
          return;
        }
      }

      const dados = {
        nome,
        sintoma,
        temperatura,
        alergia,
        observacao
      };

      salvarBtn.disabled = true;
      salvarBtn.textContent = "Salvando...";

      try {
        /*
         * Confirme se sua API realmente utiliza POST /triagem
         * e os nomes dos campos definidos em 'dados'.
         */
        const resposta = await fetch("/triagem", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        if (!resposta.ok) {
          throw new Error(
            "Não foi possível salvar. Verifique a rota da API."
          );
        }

        mostrarResultado("Triagem salva com sucesso!", "sucesso");
        form.reset();
        await carregarPacientes();
      } catch (erro) {
        console.error("Erro ao salvar triagem:", erro);
        mostrarResultado(
          "Não foi possível salvar a triagem. Confirme se o servidor está " +
          "ativo e se a rota POST /triagem existe.",
          "erro"
        );
      } finally {
        salvarBtn.disabled = false;
        salvarBtn.textContent = "Salvar Triagem";
      }
    });

    document.getElementById("atualizar-lista")
      .addEventListener("click", carregarPacientes);

    document.getElementById("abrir-tv")
      .addEventListener("click", () => {
        const tv = window.open("tv.html", "_blank");

        if (!tv) {
          mostrarResultado(
            "A abertura da TV foi bloqueada pelo navegador.",
            "erro"
          );
        }
      });

    carregarPacientes();
  </script>
</body>
</html>
